<title>Controle Financeiro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');

  :root{
    --bg:#F3EEE0;
    --surface:#FFFFFF;
    --surface-2:#FBF7EC;
    --ink:#1B211D;
    --ink-soft:#68644F;
    --ink-faint:#A29C86;
    --line:#EAE3CF;
    --line-soft:#F1EBDB;

    --green:#0E9A63;
    --green-dark:#0B5E3C;
    --green-vivid:#12B571;
    --green-soft:#D9F2E5;
    --red:#E14A38;
    --red-dark:#A82D1F;
    --red-soft:#FCE1DB;
    --amber:#E2A32B;
    --amber-dark:#B87A16;
    --amber-soft:#FBEBCB;
    --blue:#2E86D9;
    --blue-soft:#DDEEFB;
    --gray:#847F6D;
    --gray-soft:#ECE7D9;
    --gold:#D9A73B;
    --invest:#6C5CE0;
    --invest-dark:#4B3DB8;
    --invest-soft:#EAE7FB;

    --accent1:#2E86D9; --accent2:#B23FA8; --accent3:#12A583;
    --accent4:#E0752E; --accent5:#6C5CE0; --accent6:#C79A1F;

    --radius-lg:28px;
    --radius-md:19px;
    --radius-sm:13px;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-variant-numeric:tabular-nums;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  body{
    min-height:100vh; overscroll-behavior-y:none;
    background:
      radial-gradient(circle at 10% -6%, rgba(18,181,113,0.10), transparent 42%),
      radial-gradient(circle at 96% 18%, rgba(217,167,59,0.12), transparent 40%),
      var(--bg);
  }
  button{font-family:inherit;}
  input,select{font-family:inherit;}

  .ambient-orb{
    position:fixed; border-radius:50%; filter:blur(50px); z-index:0; pointer-events:none;
  }
  .ambient-orb.o1{width:220px;height:220px; top:-60px; left:-70px; background:rgba(18,181,113,0.14);}
  .ambient-orb.o2{width:200px;height:200px; top:120px; right:-80px; background:rgba(217,167,59,0.12);}
  .ambient-orb.o3{width:180px;height:180px; bottom:120px; left:-60px; background:rgba(108,92,224,0.10);}
  .ambient-orb.o4{width:220px;height:220px; bottom:-70px; right:-60px; background:rgba(225,74,56,0.07);}

  .shell{max-width:460px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + var(--safe-b)); z-index:1;}

  /* ================= TOP BAR ================= */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px;
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{
    width:32px;height:32px;border-radius:11px;
    background:linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(11,94,60,0.3), 0 4px 10px -3px rgba(18,59,41,0.5);
  }
  .brand .mark svg{width:19px;height:19px;}
  .brand .name{font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14.5px; letter-spacing:-.01em;}

  .month-pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.6); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.7); border-radius:999px;
    padding:8px 8px 8px 14px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    color:var(--ink); cursor:pointer; box-shadow:0 4px 14px -8px rgba(27,33,29,0.18);
  }
  .month-pill svg{width:14px;height:14px; color:var(--ink-faint);}
  .month-pill .chev{
    width:22px;height:22px;border-radius:50%;background:var(--gray-soft);
    display:flex;align-items:center;justify-content:center;
  }

  /* ================= HERO CARD ================= */
  .hero-wrap{padding:6px 18px 0;}
  .hero-card{
    position:relative; overflow:hidden;
    background:linear-gradient(150deg, var(--green-vivid) 0%, var(--green) 46%, var(--green-dark) 100%);
    border-radius:30px;
    padding:24px 22px 22px;
    color:#fff;
    box-shadow:0 1px 2px rgba(11,94,60,0.2), 0 18px 34px -16px rgba(11,94,60,0.5);
  }
  .hero-card.neg{background:linear-gradient(150deg, #EA6A52 0%, #C1402F 46%, #7A2418 100%);
    box-shadow:0 1px 2px rgba(122,36,24,0.2), 0 18px 34px -16px rgba(122,36,24,0.5);}
  .hero-card::before{
    content:""; position:absolute; top:-60px; right:-60px; width:190px; height:190px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.16), transparent 70%);
  }
  .hero-card::after{
    content:""; position:absolute; bottom:-80px; left:-50px; width:190px; height:190px; border-radius:50%;
    background:radial-gradient(circle, rgba(217,167,59,0.35), transparent 72%);
  }
  .hero-top{display:flex; align-items:center; justify-content:space-between; position:relative;}
  .hero-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.78;}
  .hero-badge{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:.08em;
    background:rgba(255,255,255,0.18); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.28);
    padding:5px 10px; border-radius:999px; text-transform:uppercase;
  }
  .hero-amount{
    font-family:'Fraunces',serif; font-weight:600; font-size:38px; letter-spacing:-.01em;
    margin:8px 0 16px; position:relative;
  }
  .hero-stats{
    display:flex; align-items:center; gap:8px; position:relative;
    background:rgba(255,255,255,0.14); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.24); border-radius:18px; padding:13px 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 20px -12px rgba(0,0,0,0.35);
  }
  .hero-stat{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
  .hero-stat .ic{
    width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.20);
    display:flex;align-items:center;justify-content:center; flex:none;
    border:1px solid rgba(255,255,255,0.3);
  }
  .hero-stat .ic.invest{background:rgba(217,167,59,0.35);}
  .hero-stat .ic svg{width:12px;height:12px;}
  .hero-stat .txt{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .hero-stat .txt span{font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:.05em; text-transform:uppercase; opacity:.72;}
  .hero-stat .txt b{font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
  .hero-div{width:1px; height:26px; background:rgba(255,255,255,0.22); flex:none;}
  .hero-link{
    margin-top:16px; width:100%; border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.10); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:#fff; padding:12px; cursor:pointer; border-radius:14px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em;
    display:flex; align-items:center; justify-content:center; gap:5px; position:relative;
  }
  .hero-link svg{width:12px;height:12px;}

  /* ================= SEGMENTED CONTROL ================= */
  .segmented{
    display:flex; gap:4px; margin:16px 18px 0;
    background:rgba(255,255,255,0.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.6);
    padding:4px; border-radius:999px;
    box-shadow:0 4px 14px -8px rgba(27,33,29,0.15);
  }
  .seg-btn{
    flex:1; border:none; background:transparent; padding:10px 0; border-radius:999px; cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; gap:5px; transition:all .18s ease;
  }
  .seg-btn svg{width:13px;height:13px; flex:none;}
  .seg-btn.active{background:var(--surface); color:var(--ink); box-shadow:0 2px 6px -2px rgba(27,33,29,0.18);}
  .seg-btn.active.income{color:var(--green-dark); background:linear-gradient(135deg,#fff,var(--green-soft));}
  .seg-btn.active.expense{color:var(--red-dark); background:linear-gradient(135deg,#fff,var(--red-soft));}
  .seg-btn.active.investment{color:var(--invest-dark); background:linear-gradient(135deg,#fff,var(--invest-soft));}

  /* ================= TX LIST ================= */
  .tx-section{padding:14px 18px 0;}
  .tx-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; padding:0 2px;}
  .tx-section-head span{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
  .tx-count{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-faint);}

  .tx-list{display:flex; flex-direction:column; gap:8px;}
  .tx-row{
    background:var(--surface); border:1px solid var(--line-soft); border-radius:20px;
    padding:12px 13px 12px 16px; display:flex; align-items:flex-start; gap:12px; position:relative;
    box-shadow:0 1px 2px rgba(27,33,29,0.04), 0 6px 16px -12px rgba(27,33,29,0.12);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .tx-row:active{transform:scale(0.994); box-shadow:0 1px 2px rgba(27,33,29,0.04), 0 2px 8px -6px rgba(27,33,29,0.1);}
  .tx-row::before{
    content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px;
    background:var(--stripe, var(--gray-soft));
  }
  .tx-icon{
    width:42px;height:42px;border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--gray-soft); margin-top:1px; position:relative;

  @media (min-width:461px){

  }

let DATA = null;

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function statusClass(s){
  s = (s||'').toUpperCase();
  if (s === 'APLICADO') return 'st-aplicado';
  if (s === 'RESGATADO') return 'st-resgatado';
  if (s.includes('RECEBIDO') && !s.includes('NAO') && !s.includes('NÃO')) return 'st-recebido';
  if (s.includes('NAO') || s.includes('NÃO')) return 'st-nao';
  if (s === 'PAGO') return 'st-pago';
  if (s.includes('ATRAS')) return 'st-atrasado';
  if (s.includes('DIA')) return 'st-emdia';
  return 'st-outro';
}

const INCOME_STATUSES = ['RECEBIDO','NAO RECEBIDO'];
const EXPENSE_STATUSES = ['PAGO','EM DIA','ATRASADO','MES ANTERIOR'];
const INVESTMENT_STATUSES = ['APLICADO','RESGATADO'];

const HAS_CLAUDE_STORAGE = (typeof window !== 'undefined' && !!window.storage);

async function storageGet(key){
  if (HAS_CLAUDE_STORAGE){
    try{ return await window.storage.get(key, false); }
    catch(e){ /* fall through to local */ }
  }
  try{
    const v = localStorage.getItem(key);
    return v ? { value: v } : null;
  }catch(e){ return null; }
}

async function storageSet(key, value){
  if (HAS_CLAUDE_STORAGE){
    try{ await window.storage.set(key, value, false); return true; }
    catch(e){ /* fall through to local */ }
  }
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ return false; }
}

function migrateData(){
  if (!DATA.view) DATA.view = 'month';
  if (!DATA.years || !Array.isArray(DATA.years) || DATA.years.length===0) DATA.years = [BASE_YEAR];
  if (!DATA.customGroups) DATA.customGroups = {income:{}, expense:{}, investment:{}};
  ['income','expense','investment'].forEach(seg=>{ if (!DATA.customGroups[seg]) DATA.customGroups[seg] = {}; });
  YEAR_MONTHS.forEach(m=>{
    if (!DATA.months[m]) DATA.months[m] = { income:DEFAULT_INCOME(), expense:DEFAULT_EXPENSE(), investment:DEFAULT_INVEST() };
  });
  Object.keys(DATA.months).forEach(m=>{
    if (!DATA.months[m].investment) DATA.months[m].investment = DEFAULT_INVEST();
    if (DATA.months[m].expense){
      DATA.months[m].expense.forEach(it=>{ if (!it.group) it.group = assignGroup(it.name); });
    }
    if (DATA.months[m].income){
      DATA.months[m].income.forEach(it=>{ if (!it.group) it.group = assignIncomeGroup(it.name); });
    }
    if (DATA.months[m].investment){
      DATA.months[m].investment.forEach(it=>{ if (!it.group) it.group = assignInvestGroup(it.name); });
    }
  });
  const extra = DATA.order.filter(m=>!YEAR_MONTHS.includes(m));
  DATA.order = YEAR_MONTHS.slice().concat(extra);
  if (!DATA.months[DATA.current]) DATA.current = DATA.order[0];
}

async function loadData(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if (res && res.value){
      DATA = JSON.parse(res.value);
      migrateData();
      await saveData();
      return;
    }
  }catch(e){ /* not found or error -> seed */ }
  DATA = seedData();
  await saveData();
}

  const inc = DATA.months[m].income.reduce((s,i)=>s+(Number(i.value)||0),0);
  const exp = DATA.months[m].expense.reduce((s,i)=>s+(Number(i.value)||0),0);
  const inv = (DATA.months[m].investment||[]).reduce((s,i)=>s+(Number(i.value)||0),0);
  return {inc, exp, inv, res: inc-exp};
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function smoothPathD(pts){
  if (pts.length===0) return '';
  if (pts.length===1) return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i=0;i<pts.length-1;i++){
    const p0 = pts[i===0?0:i-1];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2<pts.length ? i+2 : pts.length-1];
    const cp1x = p1[0] + (p2[0]-p0[0])/6;
    const cp1y = p1[1] + (p2[1]-p0[1])/6;
    const cp2x = p2[0] - (p3[0]-p1[0])/6;
    const cp2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C${cp1x.toFixed(1)} ${cp1y.toFixed(1)} ${cp2x.toFixed(1)} ${cp2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

function buildDonutSVG(catTotals, total, size){
  const r = size/2 - 13;
  const cx = size/2, cy = size/2;
  const circ = 2*Math.PI*r;
  const gap = catTotals.length>1 ? 4 : 0;
  let offset = 0;
  const segs = catTotals.map(c=>{
    const frac = total>0 ? c.total/total : 0;
    const len = Math.max(0, frac*circ - gap);
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.color}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${c.g}: R$ ${fmt(c.total)}</title></circle>`;
    offset += frac*circ;
    return seg;
  }).join('');
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--gray-soft)" stroke-width="13"/>
      ${segs}
    </svg>
  `;
}

function renderChartView(){
  const root = document.getElementById('view-root');
  const chartYear = yearOf(DATA.current);
  const data = DATA.order.filter(m => yearOf(m)===chartYear).map(m => ({ m, ...monthTotals(m) }));
  const totalInc = data.reduce((s,d)=>s+d.inc,0);
  const totalExp = data.reduce((s,d)=>s+d.exp,0);
  const totalInv = data.reduce((s,d)=>s+d.inv,0);
  const totalRes = totalInc - totalExp;
  const rate = totalInc > 0 ? (totalRes/totalInc*100) : 0;

  const maxVal = Math.max(1, ...data.flatMap(d=>[d.inc, d.exp, d.inv]));
  const n = data.length;
  const barW = 15, innerGap = 3;
  const groupW = barW*3 + innerGap*2;
  const leftPad = 40, rightPad = 16;
  const plotW = Math.max(660, n*(groupW+16) + leftPad + rightPad);
  const halfH = 84, topPad = 20, labelPad = 22;
  const zeroY = topPad + halfH;
  const svgH = topPad + halfH*2 + labelPad + 12;
  const step = (plotW - leftPad - rightPad) / n;

  let bars = '';
  let saldoPts = [];
  data.forEach((d,i)=>{
    const gx = leftPad + i*step + (step - groupW)/2;
    const incH = (d.inc/maxVal)*halfH;
    const invH = (d.inv/maxVal)*halfH;
    const expH = (d.exp/maxVal)*halfH;
    const incX = gx, invX = gx+barW+innerGap, expX = gx+(barW+innerGap)*2;
    bars += `<rect class="bar-income" x="${incX}" y="${zeroY-incH}" width="${barW}" height="${Math.max(incH,0.6)}" rx="${barW/2}"><title>${monthLabel(d.m)} · Ganhos: R$ ${fmt(d.inc)}</title></rect>`;
    bars += `<rect class="bar-invest" x="${invX}" y="${zeroY-invH}" width="${barW}" height="${Math.max(invH,0.6)}" rx="${barW/2}"><title>${monthLabel(d.m)} · Investido: R$ ${fmt(d.inv)}</title></rect>`;
    bars += `<rect class="bar-expense" x="${expX}" y="${zeroY}" width="${barW}" height="${Math.max(expH,0.6)}" rx="${barW/2}"><title>${monthLabel(d.m)} · Despesas: R$ ${fmt(d.exp)}</title></rect>`;
    const sy = zeroY - Math.max(-halfH, Math.min(halfH, (d.res/maxVal)*halfH));
    const cx = gx + groupW/2;
    saldoPts.push([cx, sy, d]);
    bars += `<text class="chart-month-label" x="${cx}" y="${zeroY+halfH+15}" text-anchor="middle">${monthLabel(d.m).slice(0,3)}</text>`;
  });
  const linePath = smoothPathD(saldoPts.map(p=>[p[0],p[1]]));
  const dots = saldoPts.map(p => `<circle class="saldo-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${p[2].res>=0?'var(--green-dark)':'var(--red)'}"><title>${monthLabel(p[2].m)} · Saldo: R$ ${fmt(p[2].res)}</title></circle>`).join('');

  const monthExpenses = DATA.months[DATA.current].expense;
  const monthExpTotal = monthExpenses.reduce((s,r)=>s+(Number(r.value)||0),0);
  const expGcfg = segGroups('expense');
  const catTotals = expGcfg.groups.map(g => ({
    g,
    color: expGcfg.meta[g].color,
    total: monthExpenses.filter(r=>(r.group||expGcfg.fallback)===g).reduce((s,r)=>s+(Number(r.value)||0),0),
  })).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  const donutSvg = buildDonutSVG(catTotals, monthExpTotal, 128);

  root.innerHTML = `
    <div class="chart-view">
      <div class="chart-year-switch">
        <button class="year-nav" data-year-nav="-1" ${chartYear<=Math.min(...DATA.years)?'disabled':''}>${ICON_CHEV_R.replace('m9 6 6 6-6 6','m15 6-6 6 6 6')}</button>
        <span class="year-label">${chartYear}</span>
        <button class="year-nav" data-year-nav="1" ${chartYear>=Math.max(...DATA.years)?'disabled':''}>${ICON_CHEV_R}</button>
      </div>
      <div class="stat-cards">
        <div class="stat-card c-green">
          <span class="lbl">Ganho no ano</span>
          <span class="val pos">R$ ${fmt(totalInc)}</span>
        </div>
        <div class="stat-card c-red">
          <span class="lbl">Gasto no ano</span>
          <span class="val neg">R$ ${fmt(totalExp)}</span>
        </div>
        <div class="stat-card c-invest">
          <span class="lbl">Investido no ano</span>
          <span class="val invest">R$ ${fmt(totalInv)}</span>
        </div>
        <div class="stat-card c-gold">
          <span class="lbl">Economia</span>
          <span class="val ${totalRes>=0?'pos':'neg'}">R$ ${fmt(totalRes)}</span>
          <span class="sub">${rate.toFixed(1)}% da renda</span>
        </div>
      </div>

      <div class="card">
        <div class="cat-breakdown-head">
          <h3>Gastos por categoria</h3>
          <span class="cat-breakdown-month">${monthLabel(DATA.current)}</span>
        </div>
        ${catTotals.length===0 ? `
          <div class="tx-empty">Nenhuma despesa lançada em ${monthLabel(DATA.current).toLowerCase()} ainda.</div>
        ` : `
          <div class="donut-wrap">
            <div class="donut-svg">${donutSvg}</div>
            <div class="donut-center">
              <span class="donut-total-lbl">Total</span>
              <span class="donut-total-val">R$ ${fmt(monthExpTotal)}</span>
            </div>
          </div>
          <div class="cat-bars">
            ${catTotals.map(c => {
              const pct = monthExpTotal>0 ? (c.total/monthExpTotal*100) : 0;
              return `
                <div class="cat-bar-row">
                  <div class="cat-bar-top">
                    <span class="cat-bar-label"><span class="dot" style="background:${c.color}"></span>${c.g}</span>
                    <span class="cat-bar-value">R$ ${fmt(c.total)} <span class="cat-bar-pct">${pct.toFixed(0)}%</span></span>
                  </div>

      <div class="card">

          <span class="item"><span class="sw" style="background:var(--invest)"></span>Investido</span>
          <span class="item"><span class="ln"></span>Saldo</span>
        </div>
        <div class="chart-wrap">
          <svg viewBox="0 0 ${plotW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gradIncome" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#12B571"/><stop offset="100%" stop-color="var(--green-dark)"/>

              </linearGradient>
            </defs>
            <line class="chart-zero" x1="${leftPad-10}" y1="${zeroY}" x2="${plotW-rightPad+10}" y2="${zeroY}"/>
            ${bars}
            <path class="saldo-line" d="${linePath}"/>
            ${dots}

      <div class="card" style="padding-top:14px;">

  accent1:'#2E86D9', accent2:'#B23FA8', accent3:'#12A583', accent4:'#E0752E', accent5:'#6C5CE0', accent6:'#C79A1F',
};
const GROUP_HEX = {
  'Cartões': PALETTE.accent1, 'Empréstimos': PALETTE.accent4, 'Mercado': PALETTE.accent3,
  'Gastos Pessoais': '#8A6D3F', 'Lazer': PALETTE.accent2,
};
const GROUP_GRAD = {
  'Cartões':          ['#4CA0F0','#1B5A9C'],
  'Empréstimos':      ['#F3924E','#B2481B'],
  'Mercado':          ['#3CC9A6','#0B6E58'],
  'Gastos Pessoais':  ['#C39A5C','#5C4826'],
  'Lazer':            ['#D9629C','#7A1F72'],
};
const GRADS = {
  green:  ['#12B571','#0B5E3C'],
  red:    ['#EA6A52','#7A2418'],
  invest: ['#8F7DF0','#4B3DB8'],
  gold:   ['#E8C878','#B87A16'],
};

function rrPath(ctx,x,y,w,h,r){
  const rr = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function fillRR(ctx,x,y,w,h,r,color){ ctx.fillStyle=color; rrPath(ctx,x,y,w,h,r); ctx.fill(); }
function tintRR(ctx,x,y,w,h,r,color,alpha){ ctx.save(); ctx.globalAlpha=alpha; fillRR(ctx,x,y,w,h,r,color); ctx.restore(); }
function cardBg(ctx,x,y,w,h,r){
  ctx.save();
  ctx.shadowColor = 'rgba(27,33,29,0.14)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 7;
  fillRR(ctx,x,y,w,h,r,PALETTE.white);
  ctx.restore();
  ctx.strokeStyle = PALETTE.lineSoft; ctx.lineWidth=1; rrPath(ctx,x,y,w,h,r); ctx.stroke();
}
function drawText(ctx,str,x,y,opts={}){
  ctx.font = opts.font || '13px "IBM Plex Sans"';
  ctx.fillStyle = opts.color || PALETTE.ink;
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'alphabetic';
  ctx.fillText(str, x, y);
}
function truncateToWidth(ctx, str, font, maxW){
  ctx.font = font;
  if (ctx.measureText(str).width <= maxW) return str;
  let s = str;
  while (s.length>1 && ctx.measureText(s+'…').width > maxW) s = s.slice(0,-1);
  return s+'…';
}
function formatDateBR(d){
  if (!d) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)){ const [y,m,dd]=d.split('-'); return dd+'/'+m; }
  return d;
}
function statusColor(s){
  s=(s||'').toString().toUpperCase();
  if (s==='APLICADO') return {bg:PALETTE.investSoft, fg:PALETTE.investDark};
  if (s==='RESGATADO') return {bg:PALETTE.amberSoft, fg:PALETTE.amberDark};
  if (s.includes('RECEBIDO') && !s.includes('NAO') && !s.includes('NÃO')) return {bg:PALETTE.greenSoft, fg:PALETTE.greenDark};
  if (s.includes('NAO') || s.includes('NÃO')) return {bg:PALETTE.redSoft, fg:PALETTE.redDark};
  if (s==='PAGO') return {bg:PALETTE.greenSoft, fg:PALETTE.greenDark};
  if (s.includes('ATRAS')) return {bg:PALETTE.redSoft, fg:PALETTE.redDark};
  if (s.includes('DIA')) return {bg:PALETTE.amberSoft, fg:PALETTE.amberDark};
  return {bg:'#ECE7D9', fg:PALETTE.inkSoft};
}

async function ensureFontsReady(){
  try{ if (document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
}

function renderCanvasFromLayout(W, layoutFn){
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  const H = Math.ceil(layoutFn(mctx, true, W));

  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = W*scale;
  canvas.height = H*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0,0,W,H);
  layoutFn(ctx, false, W);
  return canvas;
}

function downloadCanvas(canvas, filename){
  canvas.toBlob((blob)=>{
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/jpeg', 0.94);
}

// wraps a section of content in a white shadowed card; buildContent(ctx,draw,x,y,w) must return final y
// consistently whether draw is true or false, so height can be measured before painting the background.
function withCard(ctx, draw, x, y, w, pad, buildContent){
  const ix = x+pad, iy = y+pad, iw = w - pad*2;
  const endYMeasure = buildContent(ctx, false, ix, iy, iw);
  const cardH = (endYMeasure - iy) + pad*2;
  if (draw){
    cardBg(ctx, x, y, w, cardH, 18);
    buildContent(ctx, true, ix, iy, iw);
  }
  return y + cardH;
}

function drawHeader(ctx, draw, x, y, w, eyebrow, title){
  if (draw){
    tintRR(ctx, x, y-14, 22, 22, 6, PALETTE.greenDark, 1);
    ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.6; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(x+4,y-6); ctx.lineTo(x+18,y-6); ctx.moveTo(x+4,y-6); ctx.lineTo(x+4,y+1);
    ctx.lineTo(x+4,y+3); ctx.arcTo(x+4,y+5,x+6,y+5,2); ctx.lineTo(x+16,y+5); ctx.arcTo(x+18,y+5,x+18,y+3,2); ctx.lineTo(x+18,y-6);
    ctx.stroke(); ctx.restore();
    drawText(ctx, eyebrow, x+28, y-6, {font:'700 9.5px "IBM Plex Mono"', color:PALETTE.inkFaint});
  }
  let yy = y + 30;
  if (draw) drawText(ctx, title, x, yy, {font:'600 25px "Fraunces"', color:PALETTE.ink});
  return yy + 14;
}

function drawStatGrid(ctx, draw, x, y, w, stats){
  const gap = 10, cardW = (w-gap)/2, cardH = 68;
  stats.forEach((s,i)=>{
    const col = i%2, row = Math.floor(i/2);
    const sx = x + col*(cardW+gap), sy = y + row*(cardH+gap);
    if (draw){
      ctx.save();
      ctx.shadowColor = 'rgba(27,33,29,0.22)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8;
      const grad = ctx.createLinearGradient(sx, sy, sx+cardW, sy+cardH);
      grad.addColorStop(0, s[2]); grad.addColorStop(1, s[3]);
      fillRR(ctx, sx, sy, cardW, cardH, 16, grad);
      ctx.restore();
      ctx.save();
      ctx.beginPath(); rrPath(ctx, sx, sy, cardW, cardH, 16); ctx.clip();
      ctx.beginPath(); ctx.arc(sx+cardW-14, sy+10, 32, 0, Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fill();
      ctx.restore();
      drawText(ctx, s[0], sx+14, sy+27, {font:'700 8.5px "IBM Plex Mono"', color:'rgba(255,255,255,0.8)'});
      drawText(ctx, 'R$ '+fmt(s[1]), sx+14, sy+50, {font:'600 15px "Fraunces"', color:'#fff'});
      if (s[4]) drawText(ctx, s[4], sx+cardW-13, sy+50, {font:'700 9.5px "IBM Plex Mono"', color:'rgba(255,255,255,0.85)', align:'right'});
    }
  });
  const rows = Math.ceil(stats.length/2);
  return y + rows*cardH + (rows-1)*gap;
}

function drawCategoryBars(ctx, draw, x, y, w, catTotals, total){
  catTotals.forEach(c=>{
    const pct = total>0 ? (c.total/total*100) : 0;
    if (draw){
      ctx.beginPath(); ctx.arc(x+4, y-4, 4, 0, Math.PI*2); ctx.fillStyle=c.color; ctx.fill();
      drawText(ctx, c.g, x+14, y, {font:'600 12.5px "IBM Plex Sans"', color:PALETTE.ink});
      const valStr = 'R$ '+fmt(c.total)+'   '+pct.toFixed(0)+'%';
      drawText(ctx, valStr, x+w, y, {font:'600 11.5px "IBM Plex Mono"', color:PALETTE.inkSoft, align:'right'});
      fillRR(ctx, x, y+9, w, 8, 4, PALETTE.lineSoft);
      fillRR(ctx, x, y+9, Math.max(7,w*pct/100), 8, 4, c.color);
    }
    y += 32;
  });
  return y - 6;
}

function drawItemRow(ctx, draw, x, y, w, item, dateLabel){
  if (draw){
    const nameMaxW = w*0.6;
    const nm = truncateToWidth(ctx, item.name, '600 12.5px "IBM Plex Sans"', nameMaxW);
    drawText(ctx, nm, x, y, {font:'600 12.5px "IBM Plex Sans"', color:PALETTE.ink});
    drawText(ctx, 'R$ '+fmt(item.value), x+w, y, {font:'700 12.5px "IBM Plex Mono"', color:PALETTE.ink, align:'right'});

    const y2 = y+17;
    let lx = x;
    if (dateLabel){
      drawText(ctx, dateLabel, lx, y2+3, {font:'10px "IBM Plex Mono"', color:PALETTE.inkFaint});
      ctx.font = '10px "IBM Plex Mono"';
      lx += ctx.measureText(dateLabel).width + 9;
    }
    const sc = statusColor(item.status);
    const stText = (item.status||'').toString().toUpperCase();
    if (stText){
      ctx.font = '700 8px "IBM Plex Mono"';
      const stW = ctx.measureText(stText).width + 14;
      fillRR(ctx, lx, y2-9, stW, 15, 7.5, sc.bg);
      drawText(ctx, stText, lx+stW/2, y2-1, {font:'700 8px "IBM Plex Mono"', color:sc.fg, align:'center', baseline:'middle'});
    }
    ctx.strokeStyle = PALETTE.lineSoft; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x, y+25); ctx.lineTo(x+w, y+25); ctx.stroke();
  }
  return y+35;
}

function drawGroupPill(ctx, draw, x, y, w, groupName, subtotal){
  const gp = GROUP_GRAD[groupName] || [PALETTE.inkSoft, PALETTE.ink];
  const h = 32;
  if (draw){
    ctx.save();
    ctx.shadowColor='rgba(27,33,29,0.18)'; ctx.shadowBlur=10; ctx.shadowOffsetY=4;
    const grad = ctx.createLinearGradient(x, y-20, x+w, y+h-20);
    grad.addColorStop(0, gp[0]); grad.addColorStop(1, gp[1]);
    fillRR(ctx, x, y-20, w, h, 12, grad);
    ctx.restore();
    ctx.beginPath(); ctx.arc(x+18, y-4, 8.5, 0, Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.24)'; ctx.fill();
    drawText(ctx, groupName, x+32, y-6, {font:'700 11px "IBM Plex Sans"', color:'#fff'});
    drawText(ctx, 'R$ '+fmt(subtotal), x+w-12, y-6, {font:'700 11px "IBM Plex Mono"', color:'#fff', align:'right'});
  }
  return y+20;
}

function drawSectionLabel(ctx, draw, x, y, text_){
  if (draw){
    drawText(ctx, text_.toUpperCase(), x, y, {font:'700 10px "IBM Plex Mono"', color:PALETTE.inkFaint});
  }
  return y+18;
}

function drawFooter(ctx, draw, x, y, w){
  if (draw){
    ctx.setLineDash([3,3]);
    ctx.strokeStyle = PALETTE.line; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.stroke();
    ctx.setLineDash([]);
    const now = new Date();
    drawText(ctx, 'Gerado em '+now.toLocaleDateString('pt-BR')+' às '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · Meu Financeiro', x+w/2, y+24, {font:'10px "IBM Plex Mono"', color:PALETTE.inkFaint, align:'center'});
  }
  return y + 44;
}

function heroCardHeight(){ return 132; }
function drawHeroCard(ctx, draw, x, y, w, monthTitle, tot){
  const h = heroCardHeight();
  if (draw){
    ctx.save(); ctx.shadowColor='rgba(11,94,60,0.35)'; ctx.shadowBlur=22; ctx.shadowOffsetY=10;
    const grad = ctx.createLinearGradient(x,y,x+w,y+h);
    if (tot.res>=0){ grad.addColorStop(0,'#12B571'); grad.addColorStop(0.5,PALETTE.green); grad.addColorStop(1,PALETTE.greenDark); }
    else { grad.addColorStop(0,'#EA6A52'); grad.addColorStop(0.5,PALETTE.red); grad.addColorStop(1,'#7A2418'); }
    fillRR(ctx, x, y, w, h, 20, grad);
    ctx.restore();
    // decorative glow circles
    ctx.save(); ctx.beginPath(); ctx.arc(x+w-10,y+8,58,0,Math.PI*2); ctx.clip();
    fillRR(ctx,x,y,w,h,20,'rgba(255,255,255,0.001)');
    ctx.restore();
    drawText(ctx, 'SALDO · '+monthTitle.toUpperCase(), x+24, y+32, {font:'700 10px "IBM Plex Mono"', color:'rgba(255,255,255,0.8)'});
    drawText(ctx, (tot.res>=0?'POSITIVO':'NEGATIVO'), x+w-22, y+32, {font:'700 9px "IBM Plex Mono"', color:'rgba(255,255,255,0.9)', align:'right'});
    drawText(ctx, 'R$ '+fmt(tot.res), x+24, y+68, {font:'600 30px "Fraunces"', color:'#fff'});
    const statsY = y+100;
    const cols = [['GANHOS', tot.inc], ['DESPESAS', tot.exp], ['INVESTIDO', tot.inv]];
    const colW = w/3;
    cols.forEach((c,i)=>{
      const cx = x+24+colW*i;
      drawText(ctx, c[0], cx, statsY, {font:'700 8.5px "IBM Plex Mono"', color:'rgba(255,255,255,0.72)'});
      drawText(ctx, 'R$ '+fmt(c[1]), cx, statsY+16, {font:'600 13px "IBM Plex Sans"', color:'#fff'});
    });
  }
  return y+h;
}

// ---------- Monthly statement (detailed, itemized) ----------
function buildMonthlyLayout(ctx, measureOnly, W){
  const PAD = 26;
  const cw = W - PAD*2;
  let y = PAD;
  const draw = !measureOnly;

  const tot = monthTotals(DATA.current);
  const income = DATA.months[DATA.current].income;
  const expense = DATA.months[DATA.current].expense;
  const invest = (DATA.months[DATA.current].investment)||[];

  y = drawHeader(ctx, draw, PAD, y+14, cw, 'MEU FINANCEIRO', 'Extrato · '+monthLabel(DATA.current)+' '+yearOf(DATA.current));
  y += 6;

  if (draw) drawHeroCard(ctx, true, PAD, y, cw, monthLabel(DATA.current), tot);
  y += heroCardHeight() + 20;

  const catTotals = GROUPS.map(g => ({
    g, color: GROUP_HEX[g],
    total: expense.filter(r=>(r.group||'Gastos Pessoais')===g).reduce((s,r)=>s+(Number(r.value)||0),0),
  })).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  if (catTotals.length>0){
    y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
      let yy = drawSectionLabel(c, d, ix, iy, 'Gastos por categoria');
      yy = drawCategoryBars(c, d, ix, yy+6, iw, catTotals, tot.exp);
      return yy;
    });
    y += 16;
  }

  if (expense.length>0){
    y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
      let yy = drawSectionLabel(c, d, ix, iy, 'Detalhamento das despesas');
      yy += 4;
      GROUPS.forEach(g=>{
        const items = expense.filter(r=>(r.group||'Gastos Pessoais')===g);
        if (items.length===0) return;
        const gSub = items.reduce((s,r)=>s+(Number(r.value)||0),0);
        yy = drawGroupPill(c, d, ix, yy+15, iw, g, gSub);
        items.forEach(it=>{ yy = drawItemRow(c, d, ix, yy, iw, it, formatDateBR(it.vencimento)); });
        yy += 4;
      });
      return yy;
    });
    y += 16;
  }

  if (income.length>0){
    y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
      let yy = drawSectionLabel(c, d, ix, iy, 'Ganhos');
      yy += 4;
      income.forEach(it=>{ yy = drawItemRow(c, d, ix, yy, iw, it, it.recebimento||''); });
      return yy;
    });
    y += 16;
  }

  const investWithValue = invest.filter(it=>Number(it.value)>0);
  if (investWithValue.length>0){
    y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
      let yy = drawSectionLabel(c, d, ix, iy, 'Investimentos');
      yy += 4;
      investWithValue.forEach(it=>{ yy = drawItemRow(c, d, ix, yy, iw, it, formatDateBR(it.data)); });
      return yy;
    });
    y += 8;
  }

  y = drawFooter(ctx, draw, PAD, y+8, cw);
  return y + PAD;
}

// ---------- Monthly relation (summary only, no line items) ----------
function buildMonthlyRelationLayout(ctx, measureOnly, W){
  const PAD = 26;
  const cw = W - PAD*2;
  let y = PAD;
  const draw = !measureOnly;

  const tot = monthTotals(DATA.current);
  const expense = DATA.months[DATA.current].expense;
  const rate = tot.inc>0 ? ((tot.inc-tot.exp)/tot.inc*100) : 0;

  y = drawHeader(ctx, draw, PAD, y+14, cw, 'MEU FINANCEIRO', 'Relação Mensal · '+monthLabel(DATA.current)+' '+yearOf(DATA.current));
  y += 6;

  if (draw) drawHeroCard(ctx, true, PAD, y, cw, monthLabel(DATA.current), tot);
  y += heroCardHeight() + 20;

  y = drawStatGrid(ctx, draw, PAD, y, cw, [
    ['GANHOS', tot.inc, ...GRADS.green],
    ['DESPESAS', tot.exp, ...GRADS.red],
    ['INVESTIDO', tot.inv, ...GRADS.invest],
    ['ECONOMIA', tot.res, ...(tot.res>=0?GRADS.gold:GRADS.red), rate.toFixed(0)+'%'],
  ]);
  y += 22;

  const catTotals = GROUPS.map(g => ({
    g, color: GROUP_HEX[g],
    total: expense.filter(r=>(r.group||'Gastos Pessoais')===g).reduce((s,r)=>s+(Number(r.value)||0),0),
  })).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  if (catTotals.length>0){
    y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
      let yy = drawSectionLabel(c, d, ix, iy, 'Gastos por categoria');
      yy = drawCategoryBars(c, d, ix, yy+6, iw, catTotals, tot.exp);
      return yy;
    });
    y += 16;
  } else if (draw){
    y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
      if (d) drawText(c, 'Nenhuma despesa lançada neste mês ainda.', ix, iy+4, {font:'12px "IBM Plex Mono"', color:PALETTE.inkFaint});
      return iy+16;
    });
    y += 16;
  }

  y = drawFooter(ctx, draw, PAD, y+8, cw);
  return y + PAD;
}

// ---------- Annual relation ----------
function buildAnnualLayout(ctx, measureOnly, W){
  const PAD = 26;
  const cw = W - PAD*2;
  let y = PAD;
  const draw = !measureOnly;

  const reportYear = yearOf(DATA.current);
  const yearOrder = DATA.order.filter(m => yearOf(m)===reportYear);
  const data = yearOrder.map(m => ({ m, ...monthTotals(m) }));
  const totalInc = data.reduce((s,d)=>s+d.inc,0);
  const totalExp = data.reduce((s,d)=>s+d.exp,0);
  const totalInv = data.reduce((s,d)=>s+d.inv,0);
  const totalRes = totalInc-totalExp;
  const rate = totalInc>0 ? (totalRes/totalInc*100) : 0;

  y = drawHeader(ctx, draw, PAD, y+14, cw, 'MEU FINANCEIRO', 'Relação Anual · '+reportYear);
  y += 10;

  y = drawStatGrid(ctx, draw, PAD, y, cw, [
    ['GANHO NO ANO', totalInc, ...GRADS.green],
    ['GASTO NO ANO', totalExp, ...GRADS.red],
    ['INVESTIDO NO ANO', totalInv, ...GRADS.invest],
    ['ECONOMIA', totalRes, ...(totalRes>=0?GRADS.gold:GRADS.red), rate.toFixed(0)+'%'],
  ]);
  y += 22;

  const allExpenses = yearOrder.flatMap(m => DATA.months[m].expense||[]);
  const catTotals = GROUPS.map(g=>({
    g, color:GROUP_HEX[g],
    total: allExpenses.filter(r=>(r.group||'Gastos Pessoais')===g).reduce((s,r)=>s+(Number(r.value)||0),0),
  })).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  if (catTotals.length>0){
    y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
      let yy = drawSectionLabel(c, d, ix, iy, 'Gastos por categoria (ano)');
      yy = drawCategoryBars(c, d, ix, yy+6, iw, catTotals, totalExp);
      return yy;
    });
    y += 16;
  }

  y = withCard(ctx, draw, PAD, y, cw, 18, (c,d,ix,iy,iw)=>{
    let yy = drawSectionLabel(c, d, ix, iy, 'Resumo por mês');
    yy += 10;
    const cols2 = [['Mês',0.24],['Ganhos',0.20],['Despesas',0.20],['Investido',0.20],['Saldo',0.16]];
    let cx = ix;
    const colXs = cols2.map(cc=>{ const x=cx; cx += iw*cc[1]; return x; });
    if (d){
      fillRR(c, ix, yy-13, iw, 22, 6, PALETTE.ink);
      cols2.forEach((cc,i)=>{
        drawText(c, cc[0], i===0?colXs[i]+8:colXs[i]+iw*cc[1]-6, yy-5, {font:'700 9px "IBM Plex Mono"', color:'#fff', align:i===0?'left':'right'});
      });
    }
    yy += 12;
    data.forEach((dd,i)=>{
      if (d){
        if (i%2===0) fillRR(c, ix, yy-13, iw, 21, 0, 'rgba(0,0,0,0.03)');
        drawText(c, monthLabel(dd.m).slice(0,3), colXs[0]+8, yy+1, {font:'600 10.5px "IBM Plex Mono"', color:PALETTE.ink});
        drawText(c, fmt(dd.inc), colXs[1]+iw*cols2[1][1]-6, yy+1, {font:'10.5px "IBM Plex Mono"', color:PALETTE.inkSoft, align:'right'});
        drawText(c, fmt(dd.exp), colXs[2]+iw*cols2[2][1]-6, yy+1, {font:'10.5px "IBM Plex Mono"', color:PALETTE.inkSoft, align:'right'});
        drawText(c, fmt(dd.inv), colXs[3]+iw*cols2[3][1]-6, yy+1, {font:'10.5px "IBM Plex Mono"', color:PALETTE.investDark, align:'right'});
        drawText(c, fmt(dd.res), colXs[4]+iw*cols2[4][1]-6, yy+1, {font:'700 10.5px "IBM Plex Mono"', color:dd.res>=0?PALETTE.greenDark:PALETTE.redDark, align:'right'});
      }
      yy += 21;
    });
    return yy;
  });

  y = drawFooter(ctx, draw, PAD, y+16, cw);
  return y + PAD;
}

// ============== BOTTOM NAV (persistent, appended once per render) ==============
function ensureBottomNav(){
  let nav = document.getElementById('bottom-nav');
  if (!nav){
    nav = document.createElement('nav');
    nav.className = 'bottom-nav';
    nav.id = 'bottom-nav';
    nav.innerHTML = `
      <div class="bottom-nav-inner">
        <button class="nav-btn" data-nav="month">${ICON_LIST}<span>Extrato</span></button>
        <button class="nav-btn" data-nav="chart">${ICON_CHART}<span>Resumo</span></button>
      </div>
    `;
    document.body.appendChild(nav);
    nav.addEventListener('click', (e)=>{
      const btn = e.target.closest('.nav-btn');
      if (!btn) return;
      DATA.view = btn.dataset.nav;
      saveData();
      render();
    });
  }
  nav.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav === DATA.view);
  });
}

// ============== MONTH SHEET ==============
function renderMonthSheet(){
  const sheet = document.getElementById('month-sheet');
  const years = [...DATA.years].sort((a,b)=>a-b);
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <h3>Selecionar mês</h3>
    ${years.map(y => `
      <div class="sheet-year-label">${y}</div>
      <div class="sheet-grid">
        ${DATA.order.filter(m=>yearOf(m)===y).map(m=>{
          const t = monthTotals(m);
          return `
            <div class="sheet-chip ${m===DATA.current?'active':''}" data-pick-month="${m}">
              ${DATA.order.length>1 ? `<span class="rm" data-rm-month="${m}">✕</span>` : ''}
              <span class="m">${monthLabel(m).slice(0,3)}</span>
              <span class="r ${t.res>=0?'pos':'neg'}">${t.res>=0?'+':''}${fmt(t.res)}</span>
            </div>`;
        }).join('')}
      </div>
    `).join('')}
    <button class="sheet-add" id="sheet-add-year">+ Adicionar ano</button>
    <button class="sheet-add" id="sheet-add-month" style="margin-top:8px;">+ Adicionar mês personalizado</button>
  `;
}
function openSheet(){
  sheetOpen = true;
  document.getElementById('sheet-backdrop').classList.add('open');
  document.getElementById('month-sheet').classList.add('open');
}
function closeSheet(){
  sheetOpen = false;
  document.getElementById('sheet-backdrop').classList.remove('open');
  document.getElementById('month-sheet').classList.remove('open');
}

let categorySheetOpen = false;
function renderCategorySheet(){
  const sheet = document.getElementById('category-sheet');
  const gcfg = segGroups(segment);
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <h3>Qual categoria?</h3>
    <div class="cat-picker-grid">
      ${gcfg.groups.map(g=>{
        const meta = gcfg.meta[g];
        return `
          <button class="cat-picker-chip" data-pick-group="${g}" style="background:${meta.grad};">
            <span class="cat-picker-icon">${svgIcon(meta.icon)}</span>
            <span class="cat-picker-name">${g}</span>
          </button>`;
      }).join('')}
    </div>
    <button class="sheet-add" id="cat-add-new">${ICON_PLUS} Nova categoria</button>
  `;
}
function openCategorySheet(){
  renderCategorySheet();
  categorySheetOpen = true;
  document.getElementById('sheet-backdrop').classList.add('open');
  document.getElementById('category-sheet').classList.add('open');
}
function closeCategorySheet(){
  categorySheetOpen = false;
  document.getElementById('category-sheet').classList.remove('open');
  if (!sheetOpen) document.getElementById('sheet-backdrop').classList.remove('open');
}
function closeAnySheet(){
  if (sheetOpen) closeSheet();
  if (categorySheetOpen) closeCategorySheet();
}

const BLANK_NAME = { income:'Nova entrada', expense:'Nova saída', investment:'Novo aporte' };
const BLANK_STATUS = { income:'RECEBIDO', expense:'PAGO', investment:'APLICADO' };
const BLANK_DATE_FIELD = { income:'recebimento', expense:'vencimento', investment:'data' };
function addItemWithGroup(group){
  const kind = segment;
  const base = { id:uid(), name:BLANK_NAME[kind], value:0, status:BLANK_STATUS[kind], group };
  base[BLANK_DATE_FIELD[kind]] = '';
  DATA.months[DATA.current][kind].push(base);
  saveData();
  renderMonthView();
  const rowEl = document.querySelector(`.tx-row[data-id="${base.id}"] .tx-name`);
  if (rowEl){ rowEl.focus(); rowEl.select(); }
}

// ============== LIVE UPDATE (no full rerender on typing) ==============
function updateHeroAndTotal(){
  const tot = monthTotals(DATA.current);
  const heroCard = document.querySelector('.hero-card');
  if (heroCard){
    heroCard.classList.toggle('neg', tot.res<0);
    heroCard.querySelector('.hero-badge').textContent = tot.res>=0?'positivo':'negativo';
    heroCard.querySelector('.hero-amount').textContent = 'R$ ' + fmt(tot.res);
    const bs = heroCard.querySelectorAll('.hero-stat b');
    bs[0].textContent = 'R$ ' + fmt(tot.inc);
    bs[1].textContent = 'R$ ' + fmt(tot.exp);
    if (bs[2]) bs[2].textContent = 'R$ ' + fmt(tot.inv);
  }
  const rows = DATA.months[DATA.current][segment];
  const total = rows.reduce((s,r)=>s+(Number(r.value)||0),0);
  const totalEl = document.querySelector('.tx-total b');
  if (totalEl) totalEl.textContent = 'R$ ' + fmt(total);
}

// ============== EVENTS ==============
function wireGlobalEvents(){
  const app = document.getElementById('app');

  app.oninput = (e)=>{
    const el = e.target;
    if (!el.dataset.field) return;
    const row = el.closest('.tx-row');
    if (!row) return;
    const item = findRow(segment, row.dataset.id);
    if (!item) return;
    const field = el.dataset.field;
    item[field] = field==='value' ? (parseFloat(el.value)||0) : el.value;
    if (field==='value') updateHeroAndTotal();
    if (field==='name'){
      const icon = row.querySelector('.tx-icon');
      icon.innerHTML = iconForName(item.name);
      icon.style.background = `color-mix(in srgb, ${colorForName(item.name)} 22%, var(--gray-soft))`;
      icon.style.color = colorForName(item.name);
      row.style.setProperty('--stripe', colorForName(item.name));
    }
    saveData();
  };

  app.onchange = (e)=>{
    const el = e.target;
    if (el.classList.contains('tx-status')){
      const row = el.closest('.tx-row');
      const item = findRow(segment, row.dataset.id);
      if (item){ item.status = el.value; saveData(); }
      el.className = 'tx-status ' + statusClass(el.value);
    }
    if (el.classList.contains('tx-group')){
      const row = el.closest('.tx-row');
      const item = findRow(segment, row.dataset.id);
      if (item){ item.group = el.value; saveData(); }
      renderMonthView();
    }
  };

  app.onclick = (e)=>{
    const t = e.target;
    const seg = t.closest('[data-seg]');
    if (seg){ segment = seg.dataset.seg; renderMonthView(); return; }

    const groupToggle = t.closest('[data-toggle-group]');
    if (groupToggle){
      const g = groupToggle.dataset.toggleGroup;
      if (collapsedGroups.has(g)) collapsedGroups.delete(g); else collapsedGroups.add(g);
      renderMonthView();
      return;
    }

    if (t.id === 'open-month-sheet' || t.closest('#open-month-sheet')){ openSheet(); return; }

    if (t.id === 'open-annual-summary' || t.closest('#open-annual-summary')){
      DATA.view = 'chart';
      saveData();
      render();
      return;
    }

    const dlMonthBtn = t.closest('#download-month');
    if (dlMonthBtn){ exportMonthStatement(dlMonthBtn); return; }

    const dlMonthRelBtn = t.closest('#download-month-relation');
    if (dlMonthRelBtn){ exportMonthlyRelation(dlMonthRelBtn); return; }

    const dlAnnualBtn = t.closest('#download-annual');
    if (dlAnnualBtn){ exportAnnualReport(dlAnnualBtn); return; }

    if (t.id === 'fab-add' || t.closest('#fab-add') || t.id === 'add-item-inline' || t.closest('#add-item-inline')){
      openCategorySheet();
      return;
    }

    const delBtn = t.closest('[data-del]');
    if (delBtn){
      DATA.months[DATA.current][segment] = DATA.months[DATA.current][segment].filter(r=>r.id!==delBtn.dataset.del);
      saveData();
      renderMonthView();
      return;
    }

    const yearNav = t.closest('[data-year-nav]');
    if (yearNav){
      const delta = parseInt(yearNav.dataset.yearNav, 10);
      const curYear = yearOf(DATA.current);
      const targetYear = curYear + delta;
      if (DATA.years.includes(targetYear)){
        const base = baseName(DATA.current);
        const sameMonth = DATA.order.find(k => yearOf(k)===targetYear && baseName(k)===base);
        const firstOfYear = DATA.order.find(k => yearOf(k)===targetYear);
        DATA.current = sameMonth || firstOfYear || DATA.current;
        saveData();
        render();
      }
      return;
    }

    const miniRow = t.closest('.mini-row');
    if (miniRow){
      DATA.current = miniRow.dataset.month;
      DATA.view = 'month';
      saveData();
      render();
      return;
    }
  };

  document.getElementById('sheet-backdrop').onclick = closeAnySheet;

  const catSheet = document.getElementById('category-sheet');
  catSheet.onclick = (e)=>{
    const t = e.target;
    const chip = t.closest('[data-pick-group]');
    if (chip){
      addItemWithGroup(chip.dataset.pickGroup);
      closeCategorySheet();
      return;
    }
    if (t.id === 'cat-add-new' || t.closest('#cat-add-new')){
      const name = prompt('Nome da nova categoria:');
      if (!name) return;
      const clean = name.trim();
      if (!clean) return;
      const ok = addCustomGroup(segment, clean);
      if (!ok){ alert('Essa categoria já existe.'); return; }
      saveData();
      addItemWithGroup(clean);
      closeCategorySheet();
    }
  };

  const sheet = document.getElementById('month-sheet');
  sheet.onclick = (e)=>{
    const t = e.target;
    if (t.dataset.rmMonth){
      e.stopPropagation();
      if (DATA.order.length<=1) return;
      if (!confirm(`Remover o mês ${monthLabel(t.dataset.rmMonth)}? Essa ação não pode ser desfeita.`)) return;
      const m = t.dataset.rmMonth;
      const y = yearOf(m);
      DATA.order = DATA.order.filter(x=>x!==m);
      delete DATA.months[m];
      if (!DATA.order.some(k=>yearOf(k)===y)) DATA.years = DATA.years.filter(yy=>yy!==y);
      if (DATA.current === m) DATA.current = DATA.order[0];
      saveData();
      render();
      openSheet();
      return;
    }
    const chip = t.closest('[data-pick-month]');
    if (chip){
      DATA.current = chip.dataset.pickMonth;
      DATA.view = 'month';
      saveData();
      render();
      closeSheet();
      return;
    }
    if (t.id === 'sheet-add-year'){
      const newYear = addYear();
      DATA.current = makeKey(baseName(DATA.current), newYear);
      saveData();
      render();
      openSheet();
      return;
    }
    if (t.id === 'sheet-add-month'){
      const name = prompt('Nome do item personalizado (ex: 13º salário):');
      if (!name) return;
      const key = name.trim().toUpperCase();
      if (!key) return;
      if (DATA.months[key]){ alert('Esse item já existe.'); return; }
      DATA.months[key] = { income: DEFAULT_INCOME(), expense: DEFAULT_EXPENSE(), investment: DEFAULT_INVEST() };
      DATA.order.push(key);
      DATA.current = key;
      DATA.view = 'month';
      saveData();
      render();
      closeSheet();
      return;
    }
  };

  ensureBottomNav();
}

(async function init(){
  document.getElementById('app').innerHTML = '<p style="text-align:center;padding:100px 20px;font-family:IBM Plex Mono, monospace;color:#A29C86;letter-spacing:.05em;font-size:12px;">carregando...</p>';
  await loadData();
  render();
})();
